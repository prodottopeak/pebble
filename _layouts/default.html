<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
  <title>{{ page.title | escape }}{% unless page.title == site.title %} · {{ site.title | escape }}{% endunless %}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" type="image/png" href="{{ '/assets/pebble.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <header>
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Pebble home"><img src="{{ '/assets/pebble.png' | relative_url }}" width="40" height="40" alt="">Pebble</a>
    <nav aria-label="Main navigation">
      <a href="{{ '/support/' | relative_url }}"{% if page.url == '/support/' %} aria-current="page"{% endif %}>Support</a>
      <a href="{{ '/privacy/' | relative_url }}"{% if page.url == '/privacy/' %} aria-current="page"{% endif %}>Privacy</a>
    </nav>
  </header>
  <main id="content" tabindex="-1">{{ content }}</main>
  <footer>
    <span>Pebble by Prodotto Peak</span>
    <a href="mailto:prodottopeak@gmail.com">Contact</a>
  </footer>
</body>
</html>
