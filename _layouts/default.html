<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
  <title>{{ page.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Progress Pebble">
  <meta property="og:title" content="{{ page.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/pebble.png' | absolute_url }}">
  <meta property="og:image:alt" content="Pebble’s navy character with its yellow companion stone">
  <meta name="twitter:card" content="summary">
  <link rel="icon" type="image/svg+xml" sizes="any" href="{{ '/assets/favicon-rounded.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
<link rel="stylesheet" href="/assets/studio-footer.css">
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <header>
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Progress Pebble home"><img src="{{ '/assets/pebble.png' | relative_url }}" width="40" height="40" alt="">Progress Pebble</a>
    <nav aria-label="Main navigation">
      <a href="{{ '/support/' | relative_url }}"{% if page.url == '/support/' %} aria-current="page"{% endif %}>Support</a>
      <a href="{{ '/privacy/' | relative_url }}"{% if page.url == '/privacy/' %} aria-current="page"{% endif %}>Privacy</a>
    </nav>
  </header>
  <main id="content" tabindex="-1">{{ content }}</main>
  <footer class="pp-footer">

    <a href="https://apps.apple.com/app/id6826699210">Download on the App Store</a><a href="mailto:hello@prodottopeak.com">Contact</a>
  <!-- STUDIO:START --><div class="pp-studio" lang="en"><a class="pp-studio-brand" href="/"><img src="/assets/favicon.svg" width="28" height="28" alt="">Prodotto Peak</a><nav class="pp-studio-links" aria-label="Prodotto Peak"><a href="/apps/">All apps</a><a href="/app-development/">Build an app with us</a><a href="/apps/#app-directory">App support &amp; privacy</a><a href="mailto:hello@prodottopeak.com">Say hello <span aria-hidden="true">↗</span></a></nav></div><!-- STUDIO:END --></footer>
</body>
</html>
